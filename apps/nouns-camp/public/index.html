<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf9f6" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta
      name="description"
      content="Nouns Camp closed on September 30, 2026. Thank you for being part of it."
    />
    <title>Camp is now closed — Nouns Camp</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #292826;
        background: #faf9f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 3rem 1.5rem;
      }

      main {
        width: min(100%, 28.5rem);
      }

      .brand-icon {
        display: block;
        width: 2.16rem;
        height: 2.16rem;
      }

      p {
        margin: 1.25rem 0 0;
        color: #62605c;
        font-size: 1.05rem;
        line-height: 1.65;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        margin-top: 2rem;
      }

      a {
        color: #292826;
        font-size: 0.85rem;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="brand-icon" src="favicon.png" alt="Nouns Camp" />
      <p>
        As of September 30, 2026, Nouns Camp is no longer active. Thank you for
        being part of it.
      </p>
      <nav aria-label="Learn more">
        <a href="https://nouns.wtf/">Visit nouns.wtf</a>
        <a href="https://nouns.wtf/vote/996">Read proposal 996</a>
      </nav>
    </main>
  </body>
</html>
